<body id="page-top">
  <div id="navbar-placeholder"></div>
  <script src="js/navbar-loader.js"></script>



  <!-- Contact us form  -->
  <div class="contact3 py-5">
    <div class="row no-gutters">
      <div class="container">
        <div class="row py-5">
          <div class="col-lg-6">
            <div class="card-shadow">
              <img class="img-fluid" src="images/contact.avif" alt="Contact Image"
                style="height: 750px; width: 100%; object-fit: cover; border-radius: 4px;">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="contact-box ml-3">
              <h1 class="font-weight-light mt-2">Contact Us</h1>
              <form id="contact-us-form" class="mt-4">
                <div class="row">
                  <div class="col-lg-12">
                    <div class="form-group mt-4">
                      <input id="contact-name" class="form-control text-muted" type="text" placeholder="name" required>
                    </div>
                  </div>
                  <div class="col-lg-12">
                    <div class="form-group mt-4">
                      <input id="contact-email" class="form-control text-muted" type="email" placeholder="email address"
                        required>
                    </div>
                  </div>
                  <div class="col-lg-12">
                    <div class="form-group mt-4">
                      <input id="contact-phone" class="form-control text-muted" type="text" placeholder="phone">
                    </div>
                  </div>
                  <div class="col-lg-12">
                    <div class="form-group mt-4">
                      <textarea id="contact-message" class="form-control text-muted" rows="10" placeholder="message"
                        required></textarea>
                    </div>
                  </div>
                  <div class="col-lg-12">
                    <button type="submit" class="btn btn-danger-gradiant mt-4 text-white border-0 px-3 py-2"><span>
                        SUBMIT</span></button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>





  <!-- Modal -->
